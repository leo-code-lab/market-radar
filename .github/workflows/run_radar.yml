name: A-Share Market Radar Daily Job

on:
  schedule:
    # 每天北京时间下午 5:30 运行 (UTC 09:30)，周一至周五
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # 支持网页上手动点击按钮测试

jobs:
  run-radar-script:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行量化雷达脚本
        env:
          MAIL_AUTH_CODE: ${{ secrets.MAIL_AUTH_CODE }}
        run: |
          python 44.py
